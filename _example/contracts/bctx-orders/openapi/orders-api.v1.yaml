# REFERENCE ONLY: sanitized sample, not for production
# _example/contracts/<bctx-orders>/openapi/orders-api.v1.yaml
openapi: 3.0.3
info:
  title: <bctx-orders> · Orders API
  version: 1.0.0
  description: Reference sample. NOT FOR PRODUCTION.
servers:
  - url: https://api.example.local/<bctx-orders>/v1
paths:
  /orders:
    post:
      operationId: createOrder
      summary: 创建订单
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  schemas:
    CreateOrderRequest:
      type: object
      required: [customerId, items]
      properties:
        customerId: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
    OrderItem:
      type: object
      required: [sku, qty]
      properties:
        sku: { type: string }
        qty: { type: integer, minimum: 1 }
    Order:
      type: object
      properties:
        id:         { type: string, format: uuid }
        status:     { type: string, enum: [pending, confirmed, cancelled] }
        createdAt:  { type: string, format: date-time }
  responses:
    BadRequest:
      description: 请求格式或字段非法
      content:
        application/json:
          schema:
            $ref: 'https://raw.githubusercontent.com/example/_common/v1/error.yaml'
