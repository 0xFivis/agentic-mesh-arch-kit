# contracts/_common/asyncapi/envelope.yaml
# CloudEvents v1.0.2 信封 schema · 所有跨 bctx 事件必须套此信封 · 生产可直引
asyncapi: 3.0.0
info:
  title: Common Event Envelope (CloudEvents v1.0.2)
  version: 1.0.0
components:
  schemas:
    CloudEvent:
      type: object
      required: [specversion, id, source, type, time]
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
          description: 事件唯一 ID（UUIDv7 推荐，单调递增便于去重）
        source:
          type: string
          format: uri-reference
          description: 事件来源，格式 `/<bctx>/<service>`
          example: "/orders/svc-01-orders-api"
        type:
          type: string
          description: 事件类型，格式 `<bctx>.<entity>.<action>.v<n>`
          example: "orders.order.created.v1"
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          default: "application/json"
        dataschema:
          type: string
          format: uri
          description: 指向 contracts 中具体事件 schema
        subject:
          type: string
          description: 业务主体 ID（如订单 ID）
        traceparent:
          type: string
          description: W3C traceparent 头透传
        data:
          type: object
          description: 业务负载，由 `dataschema` 描述
