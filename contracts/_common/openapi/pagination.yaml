# contracts/_common/openapi/pagination.yaml
# 跨 bctx 通用分页参数与响应 schema · 生产可直引
openapi: 3.0.3
info:
  title: Common Pagination Schema
  version: 1.0.0
components:
  parameters:
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageToken:
      name: page_token
      in: query
      required: false
      description: Cursor，由上次响应的 `next_page_token` 提供；首次调用省略
      schema:
        type: string
  schemas:
    PageMeta:
      type: object
      required: [next_page_token]
      properties:
        next_page_token:
          type: string
          nullable: true
          description: 下一页 cursor；无更多数据时为 null
        total_estimate:
          type: integer
          nullable: true
          description: 总数估算（非精确；后端可不返回）
