# contracts/_common/openapi/error.yaml
# 跨 bctx 通用错误响应 schema · 生产可直引（非示例）
openapi: 3.0.3
info:
  title: Common Error Schema
  version: 1.0.0
components:
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 机器可读错误码，格式 `<domain>.<reason>`，例 `auth.token_expired`
          example: validation.field_required
        message:
          type: string
          description: 人类可读错误描述（英文，由调用方按需翻译）
          example: "Field 'email' is required"
        details:
          type: array
          description: 字段级错误明细（可选）
          items:
            type: object
            required: [field, issue]
            properties:
              field: { type: string }
              issue: { type: string }
        trace_id:
          type: string
          description: 分布式追踪 ID（W3C traceparent 的 trace-id 部分）
  responses:
    BadRequest:
      description: 400 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 401 未认证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 403 无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 404 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 409 资源冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 500 服务端错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
